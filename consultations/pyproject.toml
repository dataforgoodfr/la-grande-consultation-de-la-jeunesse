[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]
# Écritures volontaires dans ces scripts d'analyse : plusieurs affectations sur une ligne,
# lambdas nommées, noms de variables d'une lettre (k, n, p...).
ignore = ["E701", "E702", "E731", "E741", "E501"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["F821", "E402", "I001"]  # display() est fourni par Jupyter

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
