[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[project]
name = "15_grande_consultation_jeunesse"
version = "0.1.0"
description = "Backend du projet La Grande Consultation de la Jeunesse"
readme = "ONBOARDING.md"
requires-python = ">=3.14"
dependencies = [
    "duckdb>=1.1.3",
    "duckdb-engine>=0.15.0",
    "fastapi[standard]>=0.162.4"
]

[project.optional-dependencies]
dev = [
    "ruff>=0.2.0",
    "pytest>=9.2.0"
]

[tool.ruff]
line-length = 88
target-version = "py314"